<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>흑월의 기사 · Aseprite 기본 공격 테스트</title>
<style>
body{margin:32px auto;padding:0 16px;max-width:860px;background:#12121d;color:#eee;font:16px system-ui}
canvas{width:100%;background:#222333;border:1px solid #58506b;image-rendering:pixelated}
button{padding:10px 16px;margin:12px 6px 12px 0;font:inherit}pre{white-space:pre-wrap}a{color:#c6b8ff}
label{display:inline-block;margin:6px 14px 6px 0}input[type=range]{width:100%}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px;border:1px solid #58506b}tr.current{background:#423357}.track{height:24px;position:relative;background:#353341;margin-top:16px}.track span{position:absolute;height:100%;background:#a84835}.track i{position:absolute;top:0;height:100%;border-left:2px solid #ffe294}.active{color:#ffad75}
</style>
<h1>흑기사 기본 공격 · Aseprite 테스트</h1>
<p>바렐 combo0 · 350ms 테스트 복사본. 주황색은 판정 구간, 십자선은 월드 기준점입니다.</p>
<canvas id="preview" width="800" height="400"></canvas>
<button id="play" disabled>처음부터 재생</button><button id="pause" disabled>일시정지</button><button id="flip">좌우 반전</button>
<label><input id="loop" type="checkbox">반복</label>
<label>속도 <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
<label><input id="movement" type="checkbox" checked>기존 전진량 참조 표시</label>
<label><input id="offsets" type="checkbox" checked>메타데이터 오프셋 적용</label>
<div class="track" aria-hidden="true"><span id="hitBand"></span><i id="linkMark"></i></div>
<label for="time">공격 경과 시간 · 조절하면 일시정지</label><input id="time" type="range" min="0" max="350" step="0.5" value="0">
<pre id="status" role="status">테스트 리소스를 불러오는 중…</pre>
<table><thead><tr><th>프레임</th><th>구간 ms</th><th>기준점</th><th>오프셋 px</th><th>발 하단 / 가로 중심 px</th></tr></thead><tbody id="frames"></tbody></table>
<p>전진량은 기존 수식의 시각적 참조입니다. 발 가로 중심은 바닥 근처 픽셀 측정값으로, 동일한 지지발 추적 결과는 아닙니다. 판정 표시는 피해를 발생시키지 않습니다.</p>
<a href="index.html">게임으로 돌아가기</a>
<script src="src/animation/aseprite.js"></script>
<script src="src/animation/aseprite-preview.js"></script>
</html>
