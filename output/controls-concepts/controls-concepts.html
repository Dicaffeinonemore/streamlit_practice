#ln-controls-concepts > section { min-height: 590px; }
#ln-controls-concepts .ln-mock { --ink:#e8dfc9; --muted-ink:#baa991; --red:#b73432; --gold:#a38c62; --ground:#100e10; box-sizing:border-box; position:relative; min-height:560px; overflow:hidden; background:var(--ground); color:var(--ink); font:14px/1.6 'Malgun Gothic',sans-serif; padding:26px 30px 20px; border:1px solid #56463a; }
#ln-controls-concepts .ln-mock * { box-sizing:border-box; }
#ln-controls-concepts .ln-mock h2,#ln-controls-concepts .ln-mock h3,#ln-controls-concepts .ln-mock p { margin:0; }
#ln-controls-concepts .ln-mock h2 { font:400 32px/1.25 Georgia,'Batang',serif; letter-spacing:3px; }
#ln-controls-concepts .ln-mock h3 { font:400 25px/1.35 'Batang',serif; }
#ln-controls-concepts .eyebrow { color:var(--muted-ink); font:11px/1.5 Georgia,serif; letter-spacing:3px; }
#ln-controls-concepts .mast { position:relative; display:flex; align-items:center; justify-content:space-between; gap:16px; padding-bottom:20px; border-bottom:1px solid #66503b; margin-bottom:20px; }
#ln-controls-concepts .mark { width:46px;height:46px;border:1px solid var(--red);border-radius:50%;display:grid;place-items:center;color:var(--red);font:32px Georgia; flex:none; }
#ln-controls-concepts .section-label { color:var(--muted-ink);font-size:11px;letter-spacing:2px;margin-bottom:12px; }
#ln-controls-concepts .layout { display:grid; gap:22px; }
#ln-controls-concepts .rail { display:flex;flex-direction:column;gap:5px; }
#ln-controls-concepts button { font:inherit; color:inherit; cursor:default; }
#ln-controls-concepts .move { display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:10px 12px;text-align:left;background:transparent;border:1px solid transparent; }
#ln-controls-concepts .move[aria-pressed="true"] { background:linear-gradient(90deg,#69262580,transparent);border-color:#7a4036; }
#ln-controls-concepts kbd { display:inline-flex;align-items:center;justify-content:center;min-width:29px;min-height:30px;padding:2px 7px;background:#211c1c;border:1px solid #8a735c;border-bottom:3px solid #665040;border-radius:2px;font:13px/1.3 Georgia,serif;color:var(--ink); }
#ln-controls-concepts .stage { min-height:210px;position:relative;overflow:hidden;background:radial-gradient(circle at 72% 22%,#842f2c 0 9%,#412021 9.4%,transparent 24%),linear-gradient(#121218 0%,#29212a 67%,#393033 68%,#171416 100%);border:1px solid #554740; }
#ln-controls-concepts .stage::before { content:'';position:absolute;inset:20% 0 25%;background:#101015;clip-path:polygon(0 45%,8% 45%,8% 25%,12% 25%,12% 48%,22% 48%,22% 18%,26% 0,30% 18%,30% 60%,45% 60%,45% 30%,50% 30%,50% 70%,63% 70%,63% 24%,69% 0,75% 24%,75% 65%,88% 65%,88% 40%,92% 40%,92% 70%,100% 70%,100% 100%,0 100%);opacity:.85; }
#ln-controls-concepts .hero { position:absolute;width:190px;height:190px;bottom:0;left:15%;background:var(--ln-sprite) center/contain no-repeat;filter:drop-shadow(0 8px 4px #0009); }
#ln-controls-concepts .dummy { position:absolute;left:70%;bottom:38px;height:74px;width:28px;background:linear-gradient(90deg,#45342a,#927052,#44332a);border-radius:35% 35% 0 0; }
#ln-controls-concepts .dummy::before { content:'';position:absolute;top:23px;left:-19px;width:65px;height:10px;background:#765941;transform:rotate(-12deg); }
#ln-controls-concepts .stage-note { position:absolute;top:12px;left:14px;color:#d4baa0;font:10px Georgia;letter-spacing:2px; }
#ln-controls-concepts .floor-label { position:absolute;bottom:10px;right:12px;color:#c8b5a0;font-size:11px; }
#ln-controls-concepts .move-detail { display:grid;gap:12px;align-content:start; }
#ln-controls-concepts .move-detail p { color:var(--muted-ink);max-width:35em; }
#ln-controls-concepts .keys { display:flex;gap:9px;align-items:center;flex-wrap:wrap; }
#ln-controls-concepts .keys kbd { min-width:42px;min-height:40px;font-size:19px; }
#ln-controls-concepts .move-index { color:var(--red);font:12px Georgia;letter-spacing:2px; }
#ln-controls-concepts .foot { position:relative;display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:22px;padding-top:16px;border-top:1px solid #594736;color:var(--muted-ink);font-size:11px; }
#ln-controls-concepts .primary { padding:9px 21px;background:#562425;border:1px solid #a8654a;color:#f1dfbc; }
#ln-controls-concepts .page-label { color:var(--gold);font:11px Georgia;letter-spacing:2px; }
#ln-controls-concepts .keyboard { display:grid;gap:6px;margin-top:16px; }
#ln-controls-concepts .keyrow { display:flex;gap:5px;justify-content:center;flex-wrap:wrap; }
#ln-controls-concepts .keyrow kbd { min-width:31px;min-height:32px;color:#b9aa97; }
#ln-controls-concepts .keyrow kbd.hot { background:#702b29;color:#fff0cc;border-color:#bc7753; }
#ln-controls-concepts .v-manual .layout { grid-template-columns:125px minmax(0,1fr) 185px; }
#ln-controls-concepts .v-manual .stage { min-height:250px; }
#ln-controls-concepts .v-manual .caption { margin-top:12px;display:flex;justify-content:space-between;color:var(--muted-ink);font-size:11px; }
#ln-controls-concepts .v-book { background:#18140f; }
#ln-controls-concepts .v-book .book { display:grid;grid-template-columns:1fr 1fr;min-height:350px;background:linear-gradient(90deg,#c6ad7a,#e0c994 46%,#8b7146 49.7%,#44331e 50%,#b69a65 50.5%,#dcc28b 55%,#c8ac75);color:#30251c;box-shadow:0 8px 20px #0008;padding:25px;gap:42px; }
#ln-controls-concepts .v-book .book h3 { color:#4c291e; }
#ln-controls-concepts .v-book .book .section-label,#ln-controls-concepts .v-book .book p { color:#5f4730; }
#ln-controls-concepts .v-book .book .move { border-bottom:1px solid #735c3e55; }
#ln-controls-concepts .v-book .book .move[aria-pressed="true"] { background:#79432a20;border-color:#78432d; }
#ln-controls-concepts .v-book .book .move-index { color:#7d3526; }
#ln-controls-concepts .v-book .stage { min-height:175px;margin:14px 0;filter:sepia(.25); }
#ln-controls-concepts .v-book .hero { width:155px;height:155px; }
#ln-controls-concepts .v-training { background:#151216;padding:0; }
#ln-controls-concepts .v-training .mast { position:relative;z-index:1;padding:24px 30px 16px;margin:0;background:#121014; }
#ln-controls-concepts .v-training .stage { min-height:325px;border:0; }
#ln-controls-concepts .v-training .hero { width:270px;height:270px;left:28%; }
#ln-controls-concepts .v-training .training-strip { display:grid;grid-template-columns:165px minmax(0,1fr) auto;gap:22px;padding:20px 30px;background:#191316;border-top:1px solid #926545; }
#ln-controls-concepts .v-training .foot { margin:0;padding:16px 30px; }
#ln-controls-concepts .v-armory .layout { grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); }
#ln-controls-concepts .v-armory .keyboard { margin:0;padding:20px 0;gap:12px; }
#ln-controls-concepts .v-armory .keyrow kbd { width:42px;height:42px; }
#ln-controls-concepts .v-armory .keyrow { gap:8px; }
#ln-controls-concepts .v-armory .stage { min-height:160px;margin-bottom:16px; }
#ln-controls-concepts .v-armory .hero { height:155px;width:155px; }
#ln-controls-concepts .v-armory .binding { display:flex;justify-content:space-between;padding:10px 5px;border-bottom:1px solid #493c35;color:var(--muted-ink); }
#ln-controls-concepts .v-ritual .layout { grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:center; }
#ln-controls-concepts .sigil { position:relative;min-height:335px;border:1px solid #744139;border-radius:50%;background:radial-gradient(circle,#4b2024 0%,#201519 52%,#33201f 53%,#100e10 54%,#100e10 65%,#744139 65.5%,transparent 66%); }
#ln-controls-concepts .sigil .hero { width:250px;height:250px;bottom:35px;left:calc(50% - 125px); }
#ln-controls-concepts .sigil .sigil-key { position:absolute;z-index:1; }
#ln-controls-concepts .sigil .sigil-key:nth-of-type(1) { top:0;left:calc(50% - 15px); }
#ln-controls-concepts .sigil .sigil-key:nth-of-type(2) { top:42%;right:0; }
#ln-controls-concepts .sigil .sigil-key:nth-of-type(3) { bottom:0;left:calc(50% - 15px); }
#ln-controls-concepts .sigil .sigil-key:nth-of-type(4) { top:42%;left:0; }
#ln-controls-concepts .v-ritual .move-detail { padding-left:20px;border-left:1px solid #674137; }
#ln-controls-concepts .v-ritual .rail { flex-direction:row;flex-wrap:wrap;margin-top:20px; }
#ln-controls-concepts .v-ritual .move { width:auto; }
#ln-controls-concepts .v-story .story-grid { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px; }
#ln-controls-concepts .v-story .stage { min-height:195px; }
#ln-controls-concepts .v-story .hero { left:5%;height:160px;width:160px; }
#ln-controls-concepts .story-cell:nth-child(2) .hero { transform:translateY(-28px); }
#ln-controls-concepts .story-cell:nth-child(3) .hero { transform:translateX(20px);filter:drop-shadow(10px 0 8px #bd373750); }
#ln-controls-concepts .story-cell .page-label { display:block;margin-bottom:10px; }
#ln-controls-concepts .story-cell .keys { margin:14px 0 6px; }
#ln-controls-concepts .v-story .summary { margin-top:24px;display:flex;align-items:center;justify-content:space-between;gap:22px; }
#ln-controls-concepts .v-story .rail { flex-direction:row;flex-wrap:wrap;margin-top:14px; }
#ln-controls-concepts .v-story .move { width:auto; }
#ln-controls-concepts .v-oath .oath-grid { display:grid;grid-template-columns:150px minmax(0,1fr) 180px;gap:24px; }
#ln-controls-concepts .v-oath .banner { background:linear-gradient(#522526,#24181a);border-top:3px solid #9d7752;clip-path:polygon(0 0,100% 0,100% 92%,50% 100%,0 92%);padding:20px 12px 35px;text-align:center; }
#ln-controls-concepts .v-oath .portrait { height:180px;background:var(--ln-sprite) center/contain no-repeat; }
#ln-controls-concepts .v-oath .stage { min-height:200px;margin:16px 0; }
#ln-controls-concepts .v-oath .side-rule { border-left:1px solid #594338;padding-left:18px; }
#ln-controls-concepts .v-oath .side-rule p { padding:15px 0;color:var(--muted-ink);border-bottom:1px solid #47352d; }
#ln-controls-concepts .v-oath .oath-line { text-align:center;font:16px 'Batang',serif;letter-spacing:2px;margin-top:18px;color:#ae8d65; }
@media(max-width:720px) {
  #ln-controls-concepts .ln-mock { padding:20px 18px;min-height:780px; }
  #ln-controls-concepts > section { min-height:810px; }
  #ln-controls-concepts .ln-mock h2 { font-size:26px; }
  #ln-controls-concepts .v-manual .layout,#ln-controls-concepts .v-armory .layout,#ln-controls-concepts .v-ritual .layout,#ln-controls-concepts .v-oath .oath-grid { grid-template-columns:1fr;gap:16px; }
  #ln-controls-concepts .v-manual .rail { flex-direction:row;flex-wrap:wrap; }
  #ln-controls-concepts .v-manual .move { width:auto; }
  #ln-controls-concepts .v-manual .keyboard { display:none; }
  #ln-controls-concepts .v-book .book { grid-template-columns:1fr;padding:20px;gap:20px;background:#d5bb85; }
  #ln-controls-concepts .v-book .rail { flex-direction:row;flex-wrap:wrap; }
  #ln-controls-concepts .v-book .move { width:auto; }
  #ln-controls-concepts .v-training { padding:0; }
  #ln-controls-concepts .v-training .training-strip { grid-template-columns:1fr;padding:20px;gap:12px; }
  #ln-controls-concepts .v-training .stage { min-height:310px; }
  #ln-controls-concepts .v-training .hero { left:8%; }
  #ln-controls-concepts .v-training .mast { padding:20px; }
  #ln-controls-concepts .v-armory .keyrow kbd { width:30px;height:34px; }
  #ln-controls-concepts .v-armory .keyrow { gap:5px; }
  #ln-controls-concepts .v-ritual .sigil { width:min(100%,320px);min-height:300px;margin:auto; }
  #ln-controls-concepts .v-ritual .move-detail { padding:0;border:0; }
  #ln-controls-concepts .v-story .story-grid { grid-template-columns:1fr; }
  #ln-controls-concepts .v-story .story-cell { display:grid;grid-template-columns:95px minmax(0,1fr);gap:0 14px; }
  #ln-controls-concepts .v-story .story-cell .stage { min-height:145px;grid-column:2;grid-row:1/5; }
  #ln-controls-concepts .v-story .story-cell .hero { width:130px;height:130px;left:0; }
  #ln-controls-concepts .v-story .story-cell .dummy { left:78%;bottom:26px; }
  #ln-controls-concepts .v-story .summary { align-items:start; }
  #ln-controls-concepts .v-oath .banner { display:flex;gap:20px;align-items:center;clip-path:none;padding:10px; }
  #ln-controls-concepts .v-oath .portrait { height:100px;width:85px;flex:none; }
  #ln-controls-concepts .v-oath .side-rule { display:none; }
  #ln-controls-concepts .foot { flex-wrap:wrap; }
}
</style>
<script>
(() => {
  const root = document.getElementById('ln-controls-concepts');
  const moves = [
    ['기본 공격','Z','버튼을 이어 누르면 3연속 베기를 펼칩니다. 적을 붙잡아 두고 공격을 이어가세요.'],
    ['점프','X','낮은 공격과 바닥 충격파를 뛰어넘습니다. 이동하며 누르면 앞으로 도약합니다.'],
    ['대시','Shift','빠르게 이동하며 공격을 피합니다. 같은 방향키를 두 번 눌러도 대시할 수 있습니다.'],
    ['필살기','C','SP 100에서 흑월참을 사용합니다. 연속 베기 뒤 초승달로 마무리합니다.']
  ];
  const head = (title, sub) => `<header class="mast"><div><div class="eyebrow">LUNATIC NIGHTS · ${sub}</div><h2>${title}</h2></div><span class="mark" aria-hidden="true">☾</span></header>`;
  const rail = () => `<nav class="rail" aria-label="안내 동작">${moves.map((m,i)=>`<button type="button" class="move" data-move="${i}" aria-pressed="${i===0}"><span>${m[0]}</span><kbd>${m[1]}</kbd></button>`).join('')}</nav>`;
  const stage = (label='동작 시범 영역') => `<div class="stage" role="img" aria-label="붉은 달 아래 훈련장과 바렐의 배치 미리보기"><span class="stage-note">${label}</span><div class="hero"></div><div class="dummy"></div><span class="floor-label">바렐 · 오락실 키 배치</span></div>`;
  const detail = () => `<div class="move-detail" aria-live="polite"><span class="move-index">BAREL / BASIC COMBAT</span><h3 data-title>기본 공격</h3><div class="keys"><kbd data-key>Z</kbd><span data-sequence>→ Z → Z</span></div><p data-desc>${moves[0][2]}</p></div>`;
  const keyboard = () => `<div class="keyboard" aria-label="오락실 키 배치"><div class="keyrow"><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><kbd>F</kbd><kbd>G</kbd></div><div class="keyrow"><kbd class="hot">Z</kbd><kbd>X</kbd><kbd>C</kbd><kbd>Shift</kbd></div><div class="keyrow"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd></div></div>`;
  const foot = () => `<footer class="foot"><span>오락실 배치 · 설정에서 변경 가능</span><span class="page-label">CONTROLS / BAREL</span></footer>`;
  root.querySelector('.v-manual').innerHTML = head('전투 교본','FIELD MANUAL')+`<div class="layout"><div><div class="section-label">전투 동작</div>${rail()}</div><div>${stage()}<div class="caption"><span>◁ 이전 동작</span><span>시범 재생 영역</span><span>다음 동작 ▷</span></div></div><aside>${detail()}${keyboard()}</aside></div>`+foot();
  root.querySelector('.v-book').innerHTML = head('기사단의 전술서','THE ORDER’S CODEX')+`<div class="book"><div><div class="section-label">제1장 · 검을 쥐는 법</div><h3>살아남기 위한 네 가지 동작</h3><div style="height:22px"></div>${rail()}<p style="margin-top:18px">검은 달 아래에서도<br>검의 궤적을 잊지 말라.</p></div><div>${detail()}${stage('전술 삽화 · 동작 시범')}<div class="page-label">— XII —</div></div></div>`+foot();
  root.querySelector('.v-training').innerHTML = head('폐성의 훈련장','TRAINING GROUNDS')+stage('기본 공격 · 시범 영역')+`<div class="training-strip"><div><div class="section-label">배울 동작</div><h3 data-title>기본 공격</h3></div><div>${detail()}</div><div><div class="section-label">동작 전환</div>${rail()}</div></div>`+foot();
  root.querySelector('.v-armory').innerHTML = head('흑철 병기고','KEYS & ARMS')+`<div class="layout"><div><div class="section-label">오락실 키 배치</div>${keyboard()}<div class="binding"><span>방향키</span><span>이동 / 줄 변경</span></div><div class="binding"><span>Z · X · C</span><span>공격 · 점프 · 필살기</span></div><div class="binding"><span>Shift</span><span>대시</span></div>${rail()}</div><div>${stage('선택한 동작')}${detail()}</div></div>`+foot();
  root.querySelector('.v-ritual').innerHTML = head('월식의 비전','ARTS OF THE ECLIPSE')+`<div class="layout"><div class="sigil" role="img" aria-label="바렐 주위를 감싼 원형 문양과 네 개의 조작키"><kbd class="sigil-key">X</kbd><kbd class="sigil-key">C</kbd><kbd class="sigil-key">Shift</kbd><kbd class="sigil-key">Z</kbd><div class="hero"></div></div><div>${detail()}${rail()}</div></div>`+foot();
  root.querySelector('.v-story').innerHTML = head('전장의 연속화','READ THE BATTLE')+`<div class="story-grid">${[['01 · 첫 번째 베기','Z','적의 빈틈을 연다'],['02 · 이어 베기','Z','경직을 이어간다'],['03 · 마무리 베기','Z','연속 공격을 마친다']].map(m=>`<div class="story-cell"><span class="page-label">${m[0]}</span>${stage('연속 동작 배치')}<div class="keys"><kbd>${m[1]}</kbd></div><p>${m[2]}</p></div>`).join('')}</div><div class="summary">${detail()}</div>${rail()}`+foot();
  root.querySelector('.v-oath').innerHTML = head('출정 전의 서약','BEFORE THE HUNT')+`<div class="oath-grid"><aside class="banner"><div class="portrait" role="img" aria-label="바렐"></div><div><span class="eyebrow">BLACK KNIGHT</span><h3>바렐</h3><p>검으로 길을 여는 자</p></div></aside><main>${detail()}${stage()}${rail()}</main><aside class="side-rule"><div class="section-label">전장에 새길 것</div><p>공격은 연속해서<br>대시는 과감하게</p><p>붉은 예고는 피하고<br>낮은 충격파는 넘어라</p><p>SP가 차오르면<br>흑월참을 펼쳐라</p></aside></div><div class="oath-line">검을 들고, 검은 밤을 건너라.</div>`+foot();
  root.querySelectorAll('.ln-mock').forEach(mock => {
    mock.querySelectorAll('[data-move]').forEach(button => button.addEventListener('click', () => {
      const i=Number(button.dataset.move), move=moves[i];
      mock.querySelectorAll('[data-move]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
      mock.querySelectorAll('[data-title]').forEach(el=>el.textContent=move[0]);
      mock.querySelectorAll('[data-key]').forEach(el=>el.textContent=move[1]);
      mock.querySelectorAll('[data-desc]').forEach(el=>el.textContent=move[2]);
      mock.querySelectorAll('[data-sequence]').forEach(el=>el.textContent=i===0?'→ Z → Z':i===3?'SP 100':i===2?'또는 방향키 두 번':'');
      mock.querySelectorAll('.keyrow kbd').forEach(el=>el.classList.toggle('hot',el.textContent===move[1]));
      mock.querySelectorAll('.hero').forEach(el=>el.style.translate=i===1?'0 -30px':i===2?'35px 0':'0 0');
      if(mock.classList.contains('v-story')){
        const scenes = i===0 ? [['첫 번째 베기','Z','적의 빈틈을 연다'],['이어 베기','Z','경직을 이어간다'],['마무리 베기','Z','연속 공격을 마친다']] : i===1 ? [['도약','X','공격을 뛰어넘는다'],['공중 이동','방향키','공중에서 위치를 바꾼다'],['착지','—','전투를 이어간다']] : i===2 ? [['방향 선택','방향키','이동할 곳을 정한다'],['대시','Shift','빠르게 공격을 피한다'],['후속 공격','Z','적의 빈틈을 노린다']] : [['기력 충전','SP 100','공격하며 SP를 모은다'],['흑월참','C','필살기를 펼친다'],['초승달 마무리','—','마지막 일격을 가한다']];
        mock.querySelectorAll('.story-cell').forEach((cell,j)=>{cell.querySelector('.page-label').textContent=`0${j+1} · ${scenes[j][0]}`;cell.querySelector('kbd').textContent=scenes[j][1];cell.querySelector('p').textContent=scenes[j][2];});
      }
    }));
    const options={accent:'#b73432',ornament:true};
    const render=()=>{mock.style.setProperty('--red',options.accent);mock.querySelector('.mark').style.visibility=options.ornament?'visible':'hidden';};
    if(globalThis.Tweak){ const t=new Tweak({container:mock,onChange:render});t.addColorPicker(options,'accent',{label:'강조색',reference:'--red'});t.addToggle(options,'ornament',{label:'달 문양'}); }
  });
})();
</script>
